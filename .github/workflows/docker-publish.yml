name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up Buildx runner buildkit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Strongswan
        run: |
          sudo apt-get update
          sudo apt-get install -y strongswan libcharon-extra-plugins

      - name: Configure and Connect VPN (IKEv2)
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          # Create ipsec.secrets
          echo "$VPN_USER : EAP \"$VPN_PASSWORD\"" > ipsec.secrets
          sudo mv ipsec.secrets /etc/ipsec.secrets

          # Create ipsec.conf
          cat <<EOF > ipsec.conf
          config setup
              charondebug="ike 1, knl 1, cfg 0"
              uniqueids=no

          conn freebox
              keyexchange=ikev2
              dpdaction=clear
              dpddelay=300s
              eap_identity=$VPN_USER
              leftauth=eap-mschapv2
              left=%defaultroute
              leftsourceip=%config
              right=$VPN_SERVER
              rightid=%any
              rightauth=pubkey
              rightsubnet=0.0.0.0/0
              auto=add
          EOF
          sudo mv ipsec.conf /etc/ipsec.conf

          # Restart strongswan and connect
          sudo ipsec restart
          sleep 5
          sudo ipsec up freebox


      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add host key to known_hosts to avoid interaction
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          # Copy files
          # Note: The SSH user must have write permissions to /opt/suprennes
          # You might need to run 'sudo mkdir -p /opt/suprennes && sudo chown -R $USER:$USER /opt/suprennes' on the server first.
          ssh $SSH_USER@$SSH_HOST "mkdir -p /opt/suprennes"
          scp docker-compose.prod.yml $SSH_USER@$SSH_HOST:/opt/suprennes/docker-compose.yml
          
          # Create .env file on server
          echo "$ENV_FILE" | ssh $SSH_USER@$SSH_HOST "cat > /opt/suprennes/.env"

          # Deploy
          ssh $SSH_USER@$SSH_HOST << 'EOF'
            cd /opt/suprennes
            
            # Pull new images
            docker compose pull
            
            # Start/Restart services
            docker compose up -d --remove-orphans
            
            # Cleanup old images
            docker image prune -f
          EOF
